{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
    <h2>{{ accion }} Categoría</h2>

    <form id="formCategoria" method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.nombre.label_tag }}
            {{ form.nombre }}
        </div>

        <button type="submit" class="btn btn-success">{{ accion }}</button>
        <a href="{% url 'listar_categorias' %}" class="btn btn-secondary">Volver</a>
    </form>
</div>

<!-- === Librería SweetAlert === -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("formCategoria");
    const inputNombre = document.getElementById("id_nombre");

    // === Evita que se escriban números directamente ===
    inputNombre.addEventListener("input", function() {
        this.value = this.value.replace(/[0-9]/g, '');
    });

    form.addEventListener("submit", function(e) {
        const nombre = inputNombre.value.trim();

        // Validar campo vacío
        if (nombre === "") {
            e.preventDefault();
            Swal.fire({
                icon: "warning",
                title: "Campo requerido",
                text: "El nombre de la categoría no puede estar vacío.",
                confirmButtonColor: "#0d6efd"
            });
            return;
        }

        // Validar que no contenga números ni símbolos
        const regex = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
        if (!regex.test(nombre)) {
            e.preventDefault();
            Swal.fire({
                icon: "error",
                title: "Nombre inválido",
                text: "El nombre de la categoría solo puede contener letras y espacios.",
                confirmButtonColor: "#d33"
            });
            return;
        }
    });
});
</script>

{% endblock %}
