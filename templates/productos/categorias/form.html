{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
    <h2>{{ accion }} Categoría</h2>

    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.nombre.label_tag }}
            {{ form.nombre }}
        </div>

        <button type="submit" class="btn btn-success">{{ accion }}</button>
        <a href="{% url 'listar_categorias' %}" class="btn btn-secondary">Volver</a>
    </form>
</div>

{% endblock %}
