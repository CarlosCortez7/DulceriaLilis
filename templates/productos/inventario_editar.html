{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm p-4">
        <h3 class="mb-4 text-center">
            <i class="bi bi-pencil-square text-primary"></i> Editar Movimiento
        </h3>

        <form id="formEditarMovimiento" method="POST" action="{% url 'editar_movimiento' movimiento.id %}">
            {% csrf_token %}

            <!-- === DATOS PRINCIPALES === -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">{{ form.tipo_movimiento.label }}</label>
                    {{ form.tipo_movimiento }}
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.sku_producto.label }}</label>
                    {{ form.sku_producto }}
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.cantidad.label }}</label>
                    {{ form.cantidad }}
                </div>
            </div>

            <!-- === TRAZABILIDAD === -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">{{ form.lote.label }}</label>
                    {{ form.lote }}
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.serie.label }}</label>
                    {{ form.serie }}
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ form.fecha_vencimiento.label }}</label>
                    {{ form.fecha_vencimiento }}
                </div>
            </div>

            <!-- === REFERENCIAS === -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">{{ form.documento_referencia.label }}</label>
                    {{ form.documento_referencia }}
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ form.observaciones.label }}</label>
                    {{ form.observaciones }}
                </div>
            </div>

            <!-- === BOTONES === -->
            <div class="d-flex justify-content-end mt-4">
                <a href="{% url 'modulo_inventario' %}" class="btn btn-secondary me-2">
                    <i class="bi bi-arrow-left"></i> Cancelar
                </a>
                <button type="submit" id="btnGuardarCambios" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>

<!-- === LIBRERÍAS NECESARIAS === -->
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // === Autocompletado SKU ===
    const skuField = $('#id_sku_producto');
    if (skuField.length) {
        skuField.attr('required', true);
        skuField.autocomplete({
            source: "{% url 'autocomplete_sku' %}",
            minLength: 1,
            delay: 200,
            select: function(event, ui) {
                skuField.val(ui.item.value);
                return false;
            }
        });
    }

    // === Validaciones Front-End ===
    $('#btnGuardarCambios').on('click', function(e) {
        e.preventDefault();

        const tipo = $('#id_tipo_movimiento').val();
        const sku = $('#id_sku_producto').val().trim();
        const cantidad = parseFloat($('#id_cantidad').val());
        const fechaVenc = $('#id_fecha_vencimiento').val();
        const doc = $('#id_documento_referencia').val()?.trim() || '';
        const obs = $('#id_observaciones').val()?.trim() || '';

        // Validar tipo movimiento
        if (!tipo) {
            Swal.fire('Campo requerido', 'Debes seleccionar un tipo de movimiento.', 'warning');
            return;
        }

        // Validar SKU
        if (!sku) {
            Swal.fire('Campo requerido', 'El campo SKU no puede estar vacío.', 'warning');
            return;
        }

        // Validar cantidad
        if (isNaN(cantidad) || cantidad <= 0) {
            Swal.fire('Valor inválido', 'La cantidad debe ser un número mayor que 0.', 'error');
            return;
        }

        // Validar fecha de vencimiento
        if (fechaVenc) {
            const hoy = new Date();
            const fechaSel = new Date(fechaVenc);
            hoy.setHours(0, 0, 0, 0);
            if (fechaSel < hoy) {
                Swal.fire('Fecha inválida', 'La fecha de vencimiento no puede ser anterior a hoy.', 'error');
                return;
            }
        }

        // Validar documento referencia
        if (doc.length > 0 && doc.replace(/\s/g, '') === '') {
            Swal.fire('Campo inválido', 'El documento de referencia no puede estar vacío.', 'warning');
            return;
        }

        // Validar observaciones (máx 300 caracteres)
        if (obs.length > 300) {
            Swal.fire('Texto demasiado largo', 'Las observaciones no pueden superar los 300 caracteres.', 'warning');
            return;
        }

        // Confirmación final
        Swal.fire({
            title: '¿Guardar cambios?',
            text: 'Se actualizará el movimiento en el inventario.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Sí, guardar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#0d6efd'
        }).then((result) => {
            if (result.isConfirmed) {
                $('#formEditarMovimiento').submit();
            }
        });
    });

    // === Mensajes Django ===
    {% if messages %}
        {% for message in messages %}
            Swal.fire({
                icon: "{% if 'error' in message.tags %}error{% elif 'success' in message.tags %}success{% else %}info{% endif %}",
                title: "{{ message|escapejs }}",
                showConfirmButton: false,
                timer: 2200,
                timerProgressBar: true,
                background: "#fff",
                color: "#333",
                confirmButtonColor: "#0d6efd"
            });
        {% endfor %}
    {% endif %}
});
</script>
{% endblock %}
