{% if page_obj.has_other_pages %}
<nav aria-label="Navegación de usuarios">
    <ul class="pagination justify-content-center">
        {% if page_obj.has_previous %}
            <li class="page-item">
                <a class="page-link" href="?page={{ page_obj.previous_page_number }}&{{ querystring }}" aria-label="Anterior">&laquo;</a>
            </li>
        {% endif %}

        {% for i in page_obj.paginator.page_range %}
            <li class="page-item {% if page_obj.number == i %}active{% endif %}">
                <a class="page-link" href="?page={{ i }}&{{ querystring }}">{{ i }}</a>
            </li>
        {% endfor %}

        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}&{{ querystring }}" aria-label="Siguiente">&raquo;</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
